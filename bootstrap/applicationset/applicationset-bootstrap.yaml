apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
      - cluster: in-cluster
        name: ic-shared-minio-app
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-shared-minio
      - cluster: in-cluster
        name: ic-shared-database-app
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-shared-database
      - cluster: in-cluster
        name: ic-shared-llm-app
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-shared-llm
      - cluster: in-cluster
        name: ic-shared-img-det
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-shared-img-det
      - cluster: in-cluster
        name: ic-rhoai-configuration
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-rhoai-configuration
      - cluster: in-cluster
        name: ic-user-projects
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-user-projects
      - cluster: in-cluster
        name: ic-shared-app
        repoURL: https://github.com/rh-mobb/parasol-insurance.git
        targetRevision: dev
        path: bootstrap/ic-shared-app
  template:
    metadata:
      name: '{{name}}'
      namespace: openshift-gitops
      labels:
        component: bootstrap
        purpose: '{{name}}'
    spec:
      project: default
      source:
        repoURL: '{{repoURL}}'
        targetRevision: '{{targetRevision}}'
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: minio
          namespace: ic-shared-minio
          jqPathExpressions:
            - .spec.template.spec.containers[].image
        - group: apps
          kind: Deployment
          name: ic-app
          namespace: ic-shared-app
          jqPathExpressions:
            - .spec.template.spec.containers[].env[] | select(.name == "POSTGRES_HOST" or .name == "STORAGE_SERVICE")
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true